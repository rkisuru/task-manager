server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        # Auth routes → user-service (public)
        - id: auth-service
          uri: http://${USER_SERVICE_HOST:localhost}:${USER_SERVICE_PORT:8081}
          predicates:
            - Path=/api/auth/**

        # User routes → user-service (protected)
        - id: user-service
          uri: http://${USER_SERVICE_HOST:localhost}:${USER_SERVICE_PORT:8081}
          predicates:
            - Path=/api/users/**

        # Task routes → task-service (protected)
        - id: task-service
          uri: http://${TASK_SERVICE_HOST:localhost}:${TASK_SERVICE_PORT:8082}
          predicates:
            - Path=/api/tasks/**

      # Default filters applied to all routes
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

# JWT
jwt:
  secret: ${JWT_SECRET}

app:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:80,http://localhost,http://frontend:80}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_ENDPOINTS:health,info,prometheus,gateway}
  endpoint:
    health:
      show-details: ${ACTUATOR_HEALTH_DETAILS:always}
    gateway:
      enabled: true

logging:
  level:
    com.taskflow: ${LOG_LEVEL_APP:DEBUG}
    org.springframework.cloud.gateway: ${LOG_LEVEL_GATEWAY:INFO}
