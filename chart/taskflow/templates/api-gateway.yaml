apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: {{ .Values.namespace }}
  labels:
    app: api-gateway
    {{- include "taskflow.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.apiGateway }}
  selector:
    matchLabels:
      {{- include "taskflow.selectorLabels" (dict "app" "api-gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "taskflow.selectorLabels" (dict "app" "api-gateway") | nindent 8 }}
    spec:
      containers:
        - name: api-gateway
          image: {{ .Values.images.apiGateway }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.services.apiGateway.port }}
          env:
            # Inter-service routing
            - name: USER_SERVICE_HOST
              valueFrom:
                configMapKeyRef:
                  name: taskflow-config
                  key: USER_SERVICE_HOST
            - name: TASK_SERVICE_HOST
              valueFrom:
                configMapKeyRef:
                  name: taskflow-config
                  key: TASK_SERVICE_HOST
            - name: USER_SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: taskflow-config
                  key: USER_SERVICE_PORT
            - name: TASK_SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: taskflow-config
                  key: TASK_SERVICE_PORT
            - name: ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: taskflow-config
                  key: ALLOWED_ORIGINS
            # JWT
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: taskflow-secrets
                  key: JWT_SECRET
          resources:
            {{- toYaml .Values.resources.javaService | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.services.apiGateway.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.services.apiGateway.port }}
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: {{ .Values.namespace }}
  labels:
    app: api-gateway
    {{- include "taskflow.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "taskflow.selectorLabels" (dict "app" "api-gateway") | nindent 4 }}
  ports:
    - port: {{ .Values.services.apiGateway.port }}
      targetPort: {{ .Values.services.apiGateway.port }}
  type: ClusterIP
