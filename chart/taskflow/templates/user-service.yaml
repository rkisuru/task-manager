apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: {{ .Values.namespace }}
  labels:
    app: user-service
    {{- include "taskflow.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.userService }}
  selector:
    matchLabels:
      {{- include "taskflow.selectorLabels" (dict "app" "user-service") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "taskflow.selectorLabels" (dict "app" "user-service") | nindent 8 }}
    spec:
      containers:
        - name: user-service
          image: {{ .Values.images.userService }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.services.userService.port }}
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: taskflow-config
                  key: USER_DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: taskflow-config
                  key: USER_DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: taskflow-config
                  key: USER_DB_NAME
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: taskflow-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskflow-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: taskflow-secrets
                  key: JWT_SECRET
            - name: JWT_EXPIRATION
              valueFrom:
                configMapKeyRef:
                  name: taskflow-config
                  key: JWT_EXPIRATION
          resources:
            {{- toYaml .Values.resources.javaService | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.services.userService.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.services.userService.port }}
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: {{ .Values.namespace }}
  labels:
    app: user-service
    {{- include "taskflow.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "taskflow.selectorLabels" (dict "app" "user-service") | nindent 4 }}
  ports:
    - port: {{ .Values.services.userService.port }}
      targetPort: {{ .Values.services.userService.port }}
  type: ClusterIP
