apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: taskflow
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: taskflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: taskflow/api-gateway:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            # Inter-service routing
            - name: USER_SERVICE_HOST
              valueFrom:
                configMapKeyRef:
                  name: taskflow-config
                  key: USER_SERVICE_HOST
            - name: TASK_SERVICE_HOST
              valueFrom:
                configMapKeyRef:
                  name: taskflow-config
                  key: TASK_SERVICE_HOST
            - name: USER_SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: taskflow-config
                  key: USER_SERVICE_PORT
            - name: TASK_SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: taskflow-config
                  key: TASK_SERVICE_PORT
            - name: ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: taskflow-config
                  key: ALLOWED_ORIGINS
            # JWT
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: taskflow-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: taskflow
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: taskflow
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
